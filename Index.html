<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <main class="content-page">
        <h1 class="title">Quiz Night</h1>
        <div class="quiz">
            <div class="status">
                <p class="progress"> Question 1 of 10
                </p>
                <p class="score"> Score 1</p>
            </div>
          
        </div>

         <div class="h2-box">
                <h2>Which tag creates a link in HTML?</h2>
            </div>

                <div class="option-box">
                    <button class="option">link</button>
                    <button class="option">a</button>
                    <button class="option">href</button>
                    <button class="option">url</button>
                </div>

                <div class="footer">

                        <p class="text"><b>Correct!</b></p>

                        <button class="next-btn">next</button>
                </div>
    </main>
</body>
</html>
